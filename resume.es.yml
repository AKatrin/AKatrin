        - Desarrollé pipelines en Azure DevOps para disparar las pruebas y publicar automáticamente los resultados y reportes de Allure en Netlify, ofreciendo visibilidad inmediata al equipo.
        - Depuré el repositorio eliminando funciones obsoletas y documenté en Confluence el estado de los casos, la configuración de los pipelines y el entorno virtual.

    - employer: JalaSoft
