      highlights:
        - Desarrollé y mantuve suites automatizadas para la plataforma Application Tracking System v2 utilizando Java, Selenium, TestNG, REST Assured y Cucumber bajo el enfoque BDD y el patrón Page Object Model (POM).
        - Ejecuté pruebas automatizadas mediante pipelines en GitLab CI/CD para flujos funcionales, de regresión y de aceptación, analizando reportes de Allure para identificar defectos funcionales.
        - Optimicé el llenado de formularios parametrizando los datos recibidos por el usuario, incrementando la reutilización y flexibilidad de los escenarios de prueba.
        - Integré Checkstyle y Faker en los flujos de Gradle para asegurar la consistencia del código y aprovisionar datos dinámicos.
        - Realicé validación funcional de APIs REST con Postman y REST Assured, y participé activamente en revisiones de código (code reviews).

    - employer: JalaSoft / Proyectos de Clientes
