        - Automaticé respaldos programados de bases de datos mediante cron jobs y configuré una solución integral de monitoreo con Prometheus, Grafana, cAdvisor y Node Exporter.
        - Desplegué aplicaciones y bases de datos en AWS EC2, configurando métricas y alertas de disponibilidad en tiempo real con CloudWatch y Pingdom.
