        - Refactoricé el framework aplicando Page Object Model (POM) y principios de Programación Orientada a Objetos, reduciendo código repetitivo con Lombok y Owner.
        - Diseñé escenarios automatizados `@in-progress` desde mockups y especificaciones incluso cuando las historias carecían de criterios de aceptación completos.
        - Centralicé reportes de Checkstyle, cobertura y Allure mediante el plugin Site de Maven y generé documentación viva con Cuke-Doctor.
        - Optimicé las etapas de ejecución del pipeline de GitLab CI según tipo de ejecución (programadas, builds y merges).

