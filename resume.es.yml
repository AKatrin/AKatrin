employment:
  summary: Más de 6 años de experiencia en automatización de pruebas, arquitectura de frameworks, CI/CD y QA asistido por IA.
  history:
    - employer: JalaSoft / Proyectos de Clientes
      position: Senior Automation Engineer — Web, API & Mobile
      start: '2025-01'
      end: current
      url: https://www.jalasoft.com
      location: Cochabamba, Bolivia (Remoto / Híbrido)
      summary: Arquitectura de framework de pruebas y flujos de trabajo de QA asistidos por IA para aplicaciones empresariales Web, API y Móvil.
      keywords:
        - Java
        - Selenide
        - TestNG
        - REST Assured
        - Cucumber
        - Maven
        - SQL Server
        - Azure DevOps
        - Allure
        - Claude Code
        - MCP
        - Prettier
        - Checkstyle
        - Faker
      highlights:
        - Configuré políticas de calidad y formato de código mediante Checkstyle y Prettier en los repositorios de automatización, reduciendo observaciones repetitivas y unificando los estándares del equipo.
        - Diseñé un pipeline de CI en Azure DevOps con fases independientes para Web, Móvil, API y módulos Core, integrando validación de estilo y pruebas unitarias como validaciones previas obligatorias al merge.
        - Integré la librería Java Faker y conectividad con SQL Server para generar datos de prueba dinámicos y validar el backend, eliminando dependencias de valores quemados (hardcoded).
        - Programé pipelines de CI/CD para ejecuciones nocturnas de regresión y smoke tests, brindando retroalimentación inmediata al inicio de cada jornada.
        - Implementé flujos de trabajo asistidos por IA utilizando Claude y Claude Code para convertir casos de prueba manuales en escenarios Cucumber/Gherkin, generar step definitions en Java y acelerar la creación de scripts de UI y API.
        - Desarrollé skills reutilizables de Claude e integraciones vía Model Context Protocol (MCP) con Azure DevOps para automatizar la creación de historias de usuario y tickets, vinculándolos directamente a sus casos manuales para garantizar trazabilidad.
        - Analicé logs y reportes de Allure para diferenciar defectos funcionales reales de fallos por cambios en locators, timeouts o actualizaciones de interfaz; revisé Pull Requests para detectar waits inestables y pasos duplicados.

    - employer: JalaSoft / Proyectos de Clientes
      position: Automation Engineer — Automatización API y GUI
      start: '2024-01'
      end: '2025-01'
      url: https://www.jalasoft.com
      summary: Automatización de pruebas para el proyecto Application Tracking System v2, validando APIs REST e interfaces web.
      keywords:
