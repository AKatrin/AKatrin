        - Implementé soporte para autenticación configurable y endpoints dinámicos mediante archivos de propiedades, respaldado por pruebas unitarias en JUnit.
        - Construí un framework de pruebas de rendimiento integrando Apache JMeter con Selenium WebDriver para simular transacciones de usuarios reales y carga a nivel de UI.
        - Mantuve suites automatizadas cross-browser (Chrome y Firefox) en Salesforce, aplicando patrones de diseño (Factory y Strategy) para eliminar redundancia.
        - Ejecuté pruebas automatizadas distribuidas mediante Jenkins y Selenium Grid, investigando fallos por cambios en locators y timeouts.

    - employer: JalaSoft / Proyectos de Clientes
